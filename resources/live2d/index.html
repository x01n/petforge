<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeaPet Live2D</title>
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
canvas { display: block; width: 100%; height: 100%; background: transparent; }
#status {
    position: fixed;
    left: 8px;
    bottom: 8px;
    z-index: 2;
    color: rgba(255, 255, 255, 0.65);
    font: 12px sans-serif;
    pointer-events: none;
}
</style>
<script src="js/pixi.min.js"></script>
<script src="js/live2dcubismcore.min.js"></script>
<script src="js/pixi-live2d-display.min.js"></script>
</head>
<body>
<div id="status">正在加载桌宠…</div>
<canvas id="meapet-canvas"></canvas>
<script>
(function () {
    const coreModel = window.Live2DCubismCore && window.Live2DCubismCore.Model;
    if (!coreModel || typeof coreModel.fromMoc !== 'function') return;
    const fromMoc = coreModel.fromMoc;
    coreModel.fromMoc = function (moc) {
        const model = fromMoc.call(this, moc);
        if (model && model.renderOrders && model.drawables && !model.drawables.renderOrders) {
            model.drawables.renderOrders = model.renderOrders;
        }
        return model;
    };
})();

const canvas = document.getElementById('meapet-canvas');
const statusElement = document.getElementById('status');
// 静态调试页必须和 Qt WebEngine 运行时使用同一份当前模型；历史 Mare
// 描述已移出活动资源，不能继续回退到旧模型。
const modelUrl = 'model/mea_live2d/橙色猫猫.model3.json';
let app = null;
let model = null;
let animationFrame = 0;
let lastFrameTime = 0;
const proceduralMotions = new Set(["idle", "blink", "wave", "walk"]);
const motionState = { name: "idle", elapsed: 0 };
let facing = 1;

function layoutModel() {
    if (!app || !model) return;
    // Pixi 的默认 Application 尺寸会写回 canvas.clientWidth/clientHeight；
    // 尺寸基准必须来自窗口宿主，避免模型被布局到可视区域右侧。
    const host = canvas.parentElement || document.documentElement;
    const width = host.clientWidth || document.documentElement.clientWidth || window.innerWidth;
    const height = host.clientHeight || document.documentElement.clientHeight || window.innerHeight;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    app.renderer.resize(width, height);
    // model.width/model.height 已包含当前缩放；每次 resize 都用它们会累乘
    // scale，导致模型尺寸和动作重排后异常。固定未缩放的局部边界，始终
    // 用同一个标量写入 x/y，保证严格等比。
    if (!model.__meapetBaseSize) {
        model.scale.set(1, 1);
        const bounds = typeof model.getLocalBounds === 'function' ? model.getLocalBounds() : null;
        model.__meapetBaseSize = {
            width: Math.max(1, Number(bounds && bounds.width) || Number(model.width) || 1),
            height: Math.max(1, Number(bounds && bounds.height) || Number(model.height) || 1)
        };
    }
    const base = model.__meapetBaseSize;
    const scale = Math.max(0.001, Math.min(width / base.width, height / base.height) * 0.9);
    model.scale.set(scale, scale);
    model.x = width / 2;
    model.y = height;
    model.__meapetBaseTransform = { scale, x: width / 2, y: height, rotation: 0 };
    applyProceduralMotion(0);
}

function applyProceduralMotion(seconds) {
    if (!model || !model.__meapetBaseTransform || !proceduralMotions.has(motionState.name)) return;
    const dt = Math.max(0, Number(seconds) || 0);
    if (motionState.name !== "idle") motionState.elapsed += dt;
    if (motionState.name === "wave" && motionState.elapsed >= 0.9) {
        motionState.name = "idle";
        motionState.elapsed = 0;
    } else if (motionState.name === "blink" && motionState.elapsed >= 0.45) {
        motionState.name = "idle";
        motionState.elapsed = 0;
    }
    const base = model.__meapetBaseTransform;
    let phase = 0;
    let offsetX = 0;
    let offsetY = 0;
    let rotation = 0;
    let pulse = 1;
    if (motionState.name === "walk") {
        phase = motionState.elapsed * 12;
        offsetY = -3 * Math.abs(Math.sin(phase));
        rotation = 0.025 * Math.sin(phase);
        pulse = 1 + 0.008 * Math.sin(phase * 2);
    } else if (motionState.name === "wave") {
        phase = motionState.elapsed * Math.PI * 2 / 0.9;
        offsetX = 2 * Math.sin(phase);
        rotation = 0.045 * Math.sin(phase);
        pulse = 1 + 0.012 * Math.sin(phase * 2);
    } else if (motionState.name === "blink") {
        phase = Math.min(1, motionState.elapsed / 0.45);
        offsetY = -1.5 * Math.sin(Math.PI * phase);
    }
    const uniformScale = base.scale * pulse;
    model.scale.set(facing * uniformScale, uniformScale);
    model.x = base.x + offsetX;
    model.y = base.y + offsetY;
    model.rotation = base.rotation + rotation;
}

async function loadModel() {
    try {
        if (!window.PIXI || !window.PIXI.live2d) {
            throw new Error('Pixi Live2D runtime is unavailable');
        }
        await window.PIXI.live2d.cubism4Ready();
        const viewportWidth = document.documentElement.clientWidth || window.innerWidth || 1;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight || 1;
        app = new window.PIXI.Application({
            view: canvas,
            width: viewportWidth,
            height: viewportHeight,
            backgroundAlpha: 0,
            backgroundColor: 0x000000,
            antialias: true,
            resolution: Math.max(1, window.devicePixelRatio || 1),
            autoDensity: true,
        });
        model = await window.PIXI.live2d.Live2DModel.from(modelUrl, {
            autoInteract: false,
            autoUpdate: false,
        });
        model.anchor.set(0.5, 1.0);
        app.stage.addChild(model);
        layoutModel();
        statusElement.textContent = '';
        const runtime = { model, modelUrl, app };
        window.meapetLive2D = Object.assign(window.meapetLive2D || {}, runtime);
        // 旧调试脚本仍可读取别名，但实际模型固定为当前橙色猫猫资源。
        window.mareLive2D = window.meapetLive2D;
        startAnimationLoop();
    } catch (error) {
        statusElement.textContent = '加载失败，请检查当前 Live2D 资源';
        console.error(error);
    }
}

window.addEventListener('resize', layoutModel);
function animationTick(timestamp) {
    const now = Number(timestamp) || performance.now();
    const dt = lastFrameTime
        ? Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000))
        : 0;
    lastFrameTime = now;
    if (model && model.internalModel && typeof model.internalModel.update === 'function') {
        model.internalModel.update(dt * 1000, now);
    }
    applyProceduralMotion(dt);
    if (app && app.renderer && app.stage) app.renderer.render(app.stage);
    animationFrame = window.requestAnimationFrame(animationTick);
}
function startAnimationLoop() {
    if (!animationFrame) animationFrame = window.requestAnimationFrame(animationTick);
}
if (typeof ResizeObserver === 'function') {
    const resizeObserver = new ResizeObserver(layoutModel);
    resizeObserver.observe(document.documentElement);
}
window.setScale = function (scale) {
    if (model) model.scale.set(Number(scale), Number(scale));
};
window.meapetLive2D = window.meapetLive2D || {};
window.meapetLive2D.advance = function (seconds) {
    const dt = Math.min(0.05, Math.max(0, Number(seconds) || 0));
    if (model && model.internalModel && typeof model.internalModel.update === 'function') {
        model.internalModel.update(dt * 1000, performance.now());
    }
    applyProceduralMotion(dt);
    if (app && app.renderer && app.stage) app.renderer.render(app.stage);
};
window.meapetLive2D.playMotion = function (name) {
    if (!model) return false;
    const normalized = String(name || '').trim().toLowerCase();
    if (!proceduralMotions.has(normalized)) return false;
    motionState.name = normalized;
    motionState.elapsed = 0;
    applyProceduralMotion(0);
    return true;
};
window.meapetLive2D.setDirection = function (name) {
    const normalized = String(name || '').trim().toUpperCase();
    if (normalized !== 'A' && normalized !== 'B') return false;
    facing = normalized === 'B' ? -1 : 1;
    applyProceduralMotion(0);
    return true;
};
window.getModelSize = function () {
    return model ? { w: model.width, h: model.height } : { w: 0, h: 0 };
};
loadModel();
</script>
</body>
</html>
